---
layout: page
title: 文章标签
permalink: /tags/
---
{% assign sorted_tags = site.tags | sort %}{% for tag in sorted_tags %}<section class="archive-tag" id="{{ tag[0] | escape }}"><h2>{{ tag[0] }}</h2>{% for post in tag[1] %}<p><a href="{{ post.url | relative_url }}"><time>{{ post.date | date: '%Y-%m-%d' }}</time> {{ post.title }}</a></p>{% endfor %}</section>{% endfor %}
